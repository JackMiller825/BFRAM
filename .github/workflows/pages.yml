name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          VITE_BASE: /
          VITE_SITE: ${{ github.repository == 'JackMiller825/BFRAM' && 'marketing' || 'studio' }}
        run: npm run build
      - name: Publish the studio preview on its domain
        if: github.repository != 'JackMiller825/BFRAM'
        run: |
          printf '%s\n' 'token-campaign-studio.site' > dist/CNAME
          if [ -f dist/studio.html ]; then
            mv dist/index.html dist/bfram.html
            mv dist/studio.html dist/index.html
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
